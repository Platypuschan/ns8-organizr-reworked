approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# VueUse 4 predates proper Vue peer declarations; both packages consume
# vue-demi. Forward the application's Vue peer rather than installing another Vue.
packageExtensions:
  "@carbon/vue@3.0.32":
    peerDependencies:
      vue: "^3.0.0"
  "@vueuse/core@4.11.2":
    peerDependencies:
      vue: "^2.6.0 || ^3.0.0"
  "@vueuse/shared@4.11.2":
    peerDependencies:
      vue: "^2.6.0 || ^3.0.0"
