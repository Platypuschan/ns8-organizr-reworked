name: APK runtime refresh

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: APK runtime contract
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate inventory and base branch coherence
        run: python3 .github/scripts/apk-refresh validate
      - name: Build actual runtime and verify APK minimum targets
        run: podman build --layers -t localhost/organizr-apk-refresh:test runtime
      - name: Probe candidate and reject recorded-target downgrades
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
        run: python3 .github/scripts/apk-refresh probe --image localhost/organizr-apk-refresh:test --base "$BASE_REF"
      - name: Exercise real no-update and fail-closed paths
        env:
          APK_TEST_IMAGE: localhost/organizr-apk-refresh:test
        run: python3 -m unittest discover -s tests -p 'test_apk*.py' -v
